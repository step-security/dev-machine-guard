name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: GitHub builds a temporary gh-readonly-queue/main/* branch with
  # the PR merged onto current main and runs checks there. Without this trigger
  # nothing is reported on that commit and the queue entry fails.
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR: a new push supersedes the in-flight run. Merge-queue and
  # main runs key on their unique ref and are never cancelled, since cancelling
  # a queue run fails the queue entry.
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted:"
            echo "$UNFORMATTED"
            echo "Please run: go fmt ./..."
            exit 1
          fi

      - name: go mod tidy (verify no drift)
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod or go.sum changed after 'go mod tidy'. Please run it and commit."
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          # No released golangci-lint is built with Go 1.26 yet, and it refuses
          # to lint a module targeting a newer Go than it was built with. Compile
          # it from source with this job's Go 1.26 toolchain so the check passes.
          install-mode: goinstall

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: go build ./... (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build ./...

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make test
      - name: Test self-update fault injection (selfupdate_faults tag)
        run: go test -race -count=1 -tags selfupdate_faults,selfupdate_testkeys ./internal/faultinject/ ./internal/updatestate/ ./internal/selfupdate/ ./internal/authenticode/ ./internal/telemetry/
      - name: Test bootstrap fault checkpoints (selfupdate_faults tag)
        run: go test -race -count=1 -tags selfupdate_faults ./internal/launcher/

  # Self-update U0 harness on Linux: the trace-driven kill matrix and the
  # state corruption matrix (portable parts; Windows runs them natively in
  # test-windows-native).
  test-selfupdate-linux:
    name: Test (self-update kill matrix, linux)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -tags selfupdate_faults,selfupdate_testkeys ./internal/faultinject/ ./internal/updatestate/ ./internal/selfupdate/

  # These packages have Windows-only code and Windows-specific behavior whose
  # tests the macOS test job can only cross-compile, not run:
  #   - devicepolicy: the registry managed-policy probe, %APPDATA%
  #     settings-path resolution
  #   - secureuserfile: target-user ownership and restricted Windows ACLs
  #   - detector/credentials: reading the security descriptor behind
  #     broad_read_allow_ace_present, and the per-account environment read from
  #     the registry hive
  #   - safepath: opening a leaf without following a reparse point and matching
  #     the kernel's own final path for the handle
  #   - executor: Readlink on a real directory junction (ModeIrregular entry,
  #     NT-namespace target), which the skills detector's junction folding
  #     depends on
  #   - updatestate: MoveFileEx state replace, LockFileEx, protected DACLs
  #   - selfupdate: native arch (IsWow64Process2), WinHTTP machine proxy
  #   - authenticode: WinVerifyTrust against a test-signed copy (elevated runner)
  #   - detector TestReal_*: the Kiro CLI registry reader against a scratch
  #     HKCU key, and skills junction folding over real junctions (the rest of
  #     the detector suite assumes a POSIX host, hence the -run filter)
  # This job executes them natively; scoped to these packages so the rest of the
  # suite (which assumes a POSIX host) is untouched.
  test-windows-native:
    name: Test (windows native packages)
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./internal/devicepolicy/ ./internal/secureuserfile/ ./internal/detector/credentials/ ./internal/safepath/ ./internal/executor/ ./internal/updatestate/ ./internal/selfupdate/ ./internal/authenticode/ ./internal/awakeclock/
      - run: go test -race -count=1 -run '^TestReal_' ./internal/detector/
      - name: Test scheduled scan console suppression
        run: go test -race -count=1 -run 'Test(IsTaskRegistered|DetectInvocationMethod_Windows|HideWindow|StopUnderThenWaitReleased)' ./internal/schtasks/ ./internal/telemetry/ ./internal/winproc/
      # One command per step: the default pwsh shell only fails a step on the
      # LAST native command's exit code, so a multi-line run would mask an
      # earlier failure.
      - name: Test self-update fault injection + U0 kill matrix (selfupdate_faults tag)
        run: go test -race -count=1 -tags selfupdate_faults,selfupdate_testkeys ./internal/faultinject/ ./internal/updatestate/ ./internal/selfupdate/ ./internal/authenticode/
      - name: Test scan panic/hang run classification (selfupdate_faults tag)
        run: go test -race -count=1 -tags selfupdate_faults,selfupdate_testkeys -run 'Test(ScanPanicIsABadRun|ScanHangAfterStartedIsABadRun)' ./internal/telemetry/
      - name: Authenticode against test-signed binaries (verbose, shows skips)
        run: go test -count=1 -v -run 'TestVerify|TestForgedBag|TestTrustData|TestSameSeedPublisher' ./internal/authenticode/
      - name: Test launcher bootstrap mode
        run: go test -race -count=1 ./internal/launcher/
      - name: Test launcher bootstrap fault checkpoints (selfupdate_faults tag)
        run: go test -race -count=1 -tags selfupdate_faults ./internal/launcher/
      - name: Test self-update scheduled tasks
        run: go test -race -count=1 -run 'Test(UpdateTask|ResolveBootstrapRoot|BuildCreateArgs_Bootstrap|InstallUpdateTask|Uninstall_|TerminateUnder|WaitForInstanceMutex|StopProcess)' ./internal/schtasks/

  smoke:
    name: Smoke Tests
    runs-on: macos-latest
    needs: test
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make smoke
